project:
  name: "HumanGate-Q"
  random_seed: 42

dataset:
  kaggle_slug: "ykmadhav/synthetic-quantum-circuit-reliability-dataset"
  raw_directory: "data/raw"
  target_column: "reliability_class"
  maximum_rows: 30000
  test_fraction: 0.20
  calibration_fraction_of_training: 0.10
  policy_validation_fraction_of_training: 0.10

model:
  backend: "lightgbm_search"
  selection_metric: "accuracy"
  validation_folds: 3
  # Original Extra Trees settings are retained as the same-split baseline.
  n_estimators: 160
  max_depth: 20
  min_samples_leaf: 2
  class_weight: "balanced"
  n_jobs: -1
  candidates:
    - name: "LGB-S07"
      n_estimators: 260
      learning_rate: 0.03
      num_leaves: 7
      min_child_samples: 20
      reg_lambda: 1.0
      colsample_bytree: 1.0
      subsample: 1.0
      subsample_freq: 0
    - name: "LGB-S11"
      n_estimators: 180
      learning_rate: 0.05
      num_leaves: 11
      min_child_samples: 20
      reg_lambda: 1.0
      colsample_bytree: 1.0
      subsample: 1.0
      subsample_freq: 0
    - name: "LGB-S15"
      n_estimators: 180
      learning_rate: 0.05
      num_leaves: 15
      min_child_samples: 20
      reg_lambda: 1.0
      colsample_bytree: 1.0
      subsample: 1.0
      subsample_freq: 0
    - name: "LGB-S15-C40"
      n_estimators: 220
      learning_rate: 0.04
      num_leaves: 15
      min_child_samples: 40
      reg_lambda: 1.0
      colsample_bytree: 1.0
      subsample: 1.0
      subsample_freq: 0
    - name: "LGB-S15-L05"
      n_estimators: 220
      learning_rate: 0.04
      num_leaves: 15
      min_child_samples: 20
      reg_lambda: 0.5
      colsample_bytree: 1.0
      subsample: 1.0
      subsample_freq: 0
    - name: "LGB-S31-Bag"
      n_estimators: 180
      learning_rate: 0.04
      num_leaves: 31
      min_child_samples: 20
      reg_lambda: 1.0
      colsample_bytree: 0.9
      subsample: 0.9
      subsample_freq: 1

scenarios:
  maximum_test_cases: 5000
  proportions:
    clean: 0.55
    ambiguous_goal: 0.12
    tool_failure: 0.08
    metadata_missing: 0.10
    distribution_shift: 0.15

risk:
  weights:
    reliability: 0.35
    predictive_uncertainty: 0.17
    distribution_shift: 0.13
    verification: 0.16
    resource_complexity: 0.06
    workflow_criticality: 0.13
  interactions:
    reliability_x_criticality: 0.18
    verification_x_criticality: 0.14
  thresholds:
    repair: 0.30
    human_review: 0.50
    abstain: 0.76
    high_stakes_review: 0.38
    high_stakes_criticality: 0.85
    direct_low_probability_abstain: 0.72
  policy_tuning:
    enabled: true
    validation_maximum_cases: 2400
    target_unsafe_execution_rate: 0.12
    minimum_escalation_recall: 0.86
    minimum_safe_automation_coverage: 0.88
    maximum_human_review_rate: 0.30
    grid:
      repair: [0.20, 0.24, 0.27, 0.30, 0.33]
      human_review: [0.46, 0.48, 0.50, 0.52]
      abstain: [0.72, 0.76, 0.80]
      high_stakes_review: [0.34, 0.38, 0.42]
      direct_low_probability_abstain: [0.68, 0.72, 0.76]

evaluation:
  calibration_bins: 10
  bootstrap_repetitions: 300

output:
  directory: "outputs/latest"
